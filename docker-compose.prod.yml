# ==============================================================================
# CYBERGUARD — Full Production Docker Compose System
# ==============================================================================
# Complete end-to-end containerized deployment:
#   1. postgres         -> PostgreSQL 16 relational database (port 5432)
#   2. redis            -> Redis 7 distributed cache and job broker (port 6379)
#   3. api              -> FastAPI SOAR backend + auto-migrations (port 8000)
#   4. gmail-worker     -> Arq worker: Gmail Pub/Sub sync & discovery
#   5. email-worker     -> Arq worker: MIME extraction, ML phishing scoring & quarantine
#   6. scheduler-worker -> Arq worker: Recurring Gmail watch renewals & reconciliations
#   7. frontend         -> High-performance Nginx serving built React SPA (port 3000)
#   8. pgadmin          -> Database admin GUI (http://localhost:5050)
#   9. redisinsight     -> Redis queue & memory visualizer (http://localhost:5540)
#
# Quickstart:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cyberguard-postgres-prod
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cyberguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyberguard"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & Job Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cyberguard-redis-prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 3. FastAPI SOAR API Backend
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguard-api-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/cyberguard
      - MIGRATION_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/cyberguard
      - REDIS_URL=redis://redis:6379/0
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 4. Gmail Ingestion & Sync Worker
  # ----------------------------------------------------------------------------
  gmail-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguard-gmail-worker-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/cyberguard
      - MIGRATION_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/cyberguard
      - REDIS_URL=redis://redis:6379/0
    command: python -m arq app.workers.gmail_worker.WorkerSettings
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 5. Email Forensics & ML Analysis Worker
  # ----------------------------------------------------------------------------
  email-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguard-email-worker-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/cyberguard
      - MIGRATION_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/cyberguard
      - REDIS_URL=redis://redis:6379/0
    command: python -m arq app.workers.email_worker.WorkerSettings
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 6. Periodic Scheduler & Watch Renewal Worker
  # ----------------------------------------------------------------------------
  scheduler-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguard-scheduler-worker-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/cyberguard
      - MIGRATION_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/cyberguard
      - REDIS_URL=redis://redis:6379/0
    command: python -m arq app.workers.scheduler_worker.WorkerSettings
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 7. React Frontend SPA (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCK: "false"
        VITE_API_BASE_URL: http://localhost:8000/api/v1
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://YOUR-PROJECT.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-your-anon-key}
    container_name: cyberguard-frontend-prod
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 8. pgAdmin 4 (PostgreSQL Administration GUI)
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cyberguard-pgadmin-prod
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cyberguard.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-prod-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 9. RedisInsight (Redis Real-time Analytics & Queue Inspection)
  # ----------------------------------------------------------------------------
  redisinsight:
    image: redis/redisinsight:latest
    container_name: cyberguard-redisinsight-prod
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-prod-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cyberguard-prod-net

# ------------------------------------------------------------------------------
# Persistent Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  postgres-prod-data:
    name: cyberguard_prod_postgres_data
  redis-prod-data:
    name: cyberguard_prod_redis_data
  pgadmin-prod-data:
    name: cyberguard_prod_pgadmin_data
  redisinsight-prod-data:
    name: cyberguard_prod_redisinsight_data

networks:
  cyberguard-prod-net:
    name: cyberguard-prod-net
    driver: bridge
