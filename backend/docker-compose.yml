services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cyberguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cyberguard.org
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres

  api:
    build: .
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    depends_on: [redis, postgres]
    environment:
      - REDIS_URL=redis://redis:6379
    volumes: [".:/app"]

  gmail-worker:
    build: .
    command: uv run arq app.workers.gmail_worker.WorkerSettings
    depends_on: [redis, postgres]
    environment:
      - REDIS_URL=redis://redis:6379
    volumes: [".:/app"]

  email-worker:
    build: .
    command: uv run arq app.workers.email_worker.WorkerSettings
    depends_on: [redis, postgres]
    environment:
      - REDIS_URL=redis://redis:6379
    volumes: [".:/app"]

  scheduler-worker:
    build: .
    command: uv run arq app.workers.scheduler_worker.WorkerSettings
    depends_on: [redis, postgres]
    environment:
      - REDIS_URL=redis://redis:6379
    volumes: [".:/app"]

volumes:
  redis-data:
  redisinsight-data:
  postgres-data:
  pgadmin-data: