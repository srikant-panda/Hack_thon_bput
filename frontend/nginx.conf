# CYBERGUARD frontend — SPA + reverse proxy.
# The browser only ever talks to this one origin: nginx serves the built React
# app at / and forwards /api/* to the FastAPI container on the internal
# compose network. The SPA is built with VITE_API_BASE_URL=/api/v1 (relative),
# so API calls hit the same origin and are proxied here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Media uploads (deepfake analysis) can be large.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Frontend at / — SPA fallback routes unknown paths to the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Backend at /api/* — proxied to the FastAPI container.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # analysis + LLM calls can be slow
        proxy_send_timeout 120s;
    }

    # Unauthenticated health probe for external uptime checks.
    location = /healthz {
        proxy_pass http://api:8000/api/v1/health;
        access_log off;
    }
}
