# ==============================================================================
# CYBERGUARD — Local Development Dependencies Compose
# ==============================================================================
# Core infrastructure dependencies ONLY.
#
# PostgreSQL 16 -> localhost:5432
# Redis 7      -> localhost:6379
# pgAdmin 4    -> http://localhost:5050
# RedisInsight  -> http://localhost:5540
#
# IMPORTANT:
#   This configuration uses NO Docker volumes and NO bind mounts.
#
#   All container data is ephemeral and will be lost when the containers
#   are removed.
#
# Usage:
#   docker compose -f docker-compose.deps.yml up -d
#   docker compose -f docker-compose.deps.yml ps
#   docker compose -f docker-compose.deps.yml down
#
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cyberguard-postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: cyberguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyberguard"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - cyberguard-deps-net


  # ----------------------------------------------------------------------------
  # 2. Redis Cache & Distributed Task Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cyberguard-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

    networks:
      - cyberguard-deps-net


  # ----------------------------------------------------------------------------
  # 3. pgAdmin 4
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cyberguard-pgadmin
    restart: unless-stopped

    ports:
      - "5050:80"

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cyberguard.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "True"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cyberguard-deps-net


  # ----------------------------------------------------------------------------
  # 4. RedisInsight
  # ----------------------------------------------------------------------------
  redisinsight:
    image: redis/redisinsight:latest
    container_name: cyberguard-redisinsight
    restart: unless-stopped

    ports:
      - "5540:5540"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - cyberguard-deps-net


# ==============================================================================
# NETWORK
# ==============================================================================

networks:
  cyberguard-deps-net:
    name: cyberguard-deps-net
    driver: bridge
